<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Resume Keyword Screener architecture</title>
  <desc id="description">The browser sends documents to the FastAPI boundary, which delegates to the deterministic Python engine and Unicode report generator. Vercel Web Analytics receives aggregate page views separately and never document content.</desc>
  <rect width="1200" height="420" rx="28" fill="#070b14"/>
  <g font-family="Arial, sans-serif" fill="#f6f8fc">
    <g transform="translate(54 86)"><rect width="238" height="150" rx="18" fill="#0d1424" stroke="#53e5ff" stroke-opacity=".5"/><text x="24" y="48" font-size="15" fill="#53e5ff">BROWSER</text><text x="24" y="83" font-size="24">Next.js interface</text><text x="24" y="115" font-size="14" fill="#a9b3c8">Inputs · results · review</text></g>
    <g transform="translate(356 86)"><rect width="238" height="150" rx="18" fill="#0d1424" stroke="#6c83ff" stroke-opacity=".55"/><text x="24" y="48" font-size="15" fill="#8ea0ff">RENDER</text><text x="24" y="83" font-size="24">FastAPI boundary</text><text x="24" y="115" font-size="14" fill="#a9b3c8">Validation · errors · CORS</text></g>
    <g transform="translate(658 86)"><rect width="238" height="150" rx="18" fill="#0d1424" stroke="#75e6b4" stroke-opacity=".5"/><text x="24" y="48" font-size="15" fill="#75e6b4">PYTHON</text><text x="24" y="83" font-size="24">Deterministic engine</text><text x="24" y="115" font-size="14" fill="#a9b3c8">Lexical analysis · scoring</text></g>
    <g transform="translate(960 86)"><rect width="186" height="150" rx="18" fill="#0d1424" stroke="#f2be72" stroke-opacity=".5"/><text x="24" y="48" font-size="15" fill="#f2be72">OUTPUT</text><text x="24" y="83" font-size="22">Unicode PDF</text><text x="24" y="115" font-size="14" fill="#a9b3c8">In-memory bytes</text></g>
    <path d="M292 161h64M594 161h64M896 161h64" stroke="#707b94" stroke-width="2"/><path d="m347 154 9 7-9 7m302-14 9 7-9 7m302-14 9 7-9 7" fill="none" stroke="#707b94" stroke-width="2"/>
    <g transform="translate(54 290)"><rect width="540" height="76" rx="14" fill="#0a1020" stroke="#707b94" stroke-opacity=".35"/><text x="22" y="31" font-size="14" fill="#a9b3c8">VERCEL WEB ANALYTICS</text><text x="22" y="55" font-size="14">Aggregate public page views only — no résumé or job-description content</text></g>
    <path d="M173 236v54" stroke="#707b94" stroke-width="2" stroke-dasharray="5 6"/>
  </g>
</svg>
