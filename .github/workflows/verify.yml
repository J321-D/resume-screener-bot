name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      python_changed: ${{ steps.diff.outputs.python_changed }}
      frontend_changed: ${{ steps.diff.outputs.frontend_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
            files="$(git diff --name-only "$base"...HEAD)"
          else
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              files="$(git diff --name-only "$before" HEAD)"
            elif git rev-parse HEAD^ >/dev/null 2>&1; then
              files="$(git diff --name-only HEAD^ HEAD)"
            else
              # Unknown ancestry fails open.
              echo "python_changed=true" >> "$GITHUB_OUTPUT"
              echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          frontend_changed=false
          python_changed=false
          only_frontend=true
          any=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            any=true
            case "$path" in
              frontend/*)
                frontend_changed=true
                ;;
              .github/workflows/verify.yml)
                frontend_changed=true
                python_changed=true
                only_frontend=false
                ;;
              *)
                python_changed=true
                only_frontend=false
                ;;
            esac
          done <<< "$files"

          if [[ "$any" != "true" ]]; then
            # Empty/ambiguous diff fails open.
            python_changed=true
            frontend_changed=true
          elif [[ "$only_frontend" == "true" ]]; then
            python_changed=false
          fi

          echo "python_changed=$python_changed" >> "$GITHUB_OUTPUT"
          echo "frontend_changed=$frontend_changed" >> "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.python_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: MPLCONFIGDIR=/tmp/resume-screener-matplotlib python -m unittest discover -s tests -v
      - run: python scripts/check_app.py
      - run: python -m pip check

  frontend:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.frontend_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck --pretty false
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm audit --prod
